# ============================================================
# 亚马逊畅销榜爬虫配置
# 修改后保存即可，无需改代码；某一行缺失时脚本会用默认值兜底
# ============================================================

[scraper]

# 每个品类最多翻多少页（防死循环的安全上限，不是固定抓这么多页）。
# 爬虫会一直翻页，直到某一页「没有商品」为止；这个值只是封顶。
# 目前亚马逊畅销榜每页 30 条，想抓满前 100 名约需 4 页，默认给 10 页绰绰有余。
max_pages_per_category = 10

# Clash 代理地址，访问亚马逊用。格式：IP:端口
proxy = 127.0.0.1:7897

# 是否无头运行浏览器：
#   false = 弹出浏览器窗口（调试时用，能亲眼看到页面）
#   true  = 后台无头运行（正式跑批时用，不弹窗）
headless = false

# 每翻一页之间的等待秒数。调大一点能降低被反爬识别的概率
page_delay_seconds = 2
